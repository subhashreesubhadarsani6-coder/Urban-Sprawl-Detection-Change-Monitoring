# UrbanScope AI - Siamese U-Net (FC-Siam-diff) Training Configuration

dataset:
  train_parquet: "dataset/train-00000-of-00001.parquet"
  test_parquet: "dataset/test-00000-of-00001.parquet"
  splits_file: "configs/geographic_splits.json"
  format: "parquet_single_shard"
  in_channels: 3
  patch_size: 256
  stride: 128
  min_valid_ratio: 0.5
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  hflip_prob: 0.5
  vflip_prob: 0.5
  rot90_prob: 0.5

model:
  architecture: "FC-Siam-diff"
  in_channels: 3
  base_channels: 32
  num_classes: 1

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: 4.0  # Counteract ~3% change pixel imbalance
  smooth: 1.0

training:
  batch_size: 4
  epochs: 5
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 4
  use_amp: false
  num_workers: 0  # Safe for Windows multiprocessing

validation:
  candidate_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
  metric: "f1"

checkpoints:
  dir: "checkpoints"
  best_name: "best_checkpoint.pth"
  latest_name: "latest_checkpoint.pth"

reproducibility:
  seed: 42
  deterministic: true
